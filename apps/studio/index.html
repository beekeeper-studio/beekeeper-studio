<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Beekeeper-Studio</title>

    <link rel="stylesheet" type="text/css" href="./src/assets/styles/tokens/index.scss">

    <link id="theme" rel="stylesheet" type="text/css">
    <script>
      const params = new URLSearchParams(location.search);
      const rawThemeId = params.get("themeId");
      const themeId = /^[a-zA-Z0-9_-]+$/.test(rawThemeId || "") ? rawThemeId : "default";
      const appearance = params.get("appearance") || "auto";
      const themeLink = document.getElementById("theme");
      themeLink.onerror = () => {
        if (themeId === "default") {
          return;
        }
        themeLink.href = "theme://default/style.css";
      };
      themeLink.href = `theme://${themeId}/style.css`;
    </script>

    <script src="./src-commercial/entrypoints/renderer.ts" type="module"></script>
  </head>
  <body id="body">
    <script>
      const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = appearance === "auto" ? systemDark : appearance === "dark";
      document.body.classList.add(isDark ? "dark-theme" : "light-theme");
    </script>
    <noscript>
      <strong>We're sorry but beekeeper-studio doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app" class="app-loading">
      <style>
        body, .app-loading {
          position: absolute;
          top: 0;
          right: 0;
          left: 0;
          bottom: 0;
          margin: 0;
          padding: 0;
          background: var(--app-bg);
          overflow: hidden;
        }
        .app-loading {
          position: absolute;
          top: 0;
          right: 0;
          left: 0;
          bottom: 0;
          display: table;
          width: 100%;
          height: 100%;
          -webkit-app-region: drag;
        }
        .preloader-wrap {
          font-family: system-ui,
            -apple-system, BlinkMacSystemFont,
            "Segoe UI",
            "Roboto",
            "Oxygen",
            "Ubuntu",
            "Cantarell",
            "Fira Sans",
            "Droid Sans",
            "Helvetica Neue",
            Arial, sans-serif;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          background: var(--preloader-bg);
          color: var(--preloader-fg);
          font-size: 14px;
        }
        .preloader {
          height: 100px;
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 6px;
        }
        .preloader .layer {
          display: block;
          position: absolute;
          height: 50px;
          width: 50px;
          border-radius: 50%;
          box-shadow: 1px 1px var(--preloader-accent),
                      1px 2px rgba(0, 0, 0 , 0.25);
          transform: rotateX(50deg) rotateY(0deg) rotateZ(45deg);
        }
        .preloader .layer:nth-of-type(1) {
          background: rgb(from var(--preloader-accent) r g b / 0.65);
          margin-top: 36px;
          animation: movedown  0.8s cubic-bezier(0.39, 0.575, 0.565, 1)  0.4s infinite normal;
        }
        .preloader .layer:nth-of-type(2) {
          background: rgb(from var(--preloader-accent) r g b / 0.65);
          margin-top: 18px;
        }
        .preloader .layer:nth-of-type(3) {
          background: rgb(from var(--preloader-accent) r g b / 0.75);
          animation: moveup  0.8s cubic-bezier(0.39, 0.575, 0.565, 1) infinite normal;
        }
        @keyframes moveup {
          0%, 60%, 100% {
            transform:
              rotateX(50deg)
              rotateY(0deg)
              rotateZ(45deg)
              translateZ(0);
          }
          25% {
            transform:
              rotateX(50deg)
              rotateY(0deg)
              rotateZ(45deg)
              translateZ(5px);
          }
        }
        @keyframes movedown {
          0%, 60%, 100% {
            transform:
              rotateX(50deg)
              rotateY(0deg)
              rotateZ(45deg)
              translateZ(0);
          }
          25% {
            transform:
              rotateX(50deg)
              rotateY(0deg)
              rotateZ(45deg)
              translateZ(-5px);
          }
        }
      </style>
      <div class="preloader-wrap">
        <div class="preloader">
          <i class="layer layer-bottom"></i>
          <i class="layer layer-middle"></i>
          <i class="layer layer-top"></i>
        </div>
        <span class="preloader-text">Loading</span>
      </div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
