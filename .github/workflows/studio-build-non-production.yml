name: Studio - Build [non production]

permissions:
  contents: read
  actions: write

on:
  pull_request:
    paths-ignore:
      - apps/sqltools/**
      - docs/**
  push:
    branches:
      - "master"
    paths-ignore:
      - 'apps/sqltools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  masterbuild:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022, ubuntu-22.04-arm, windows-11-arm]

    env:
      # node-gyp uses Python to build native modules from source.
      PYTHON_VERSION: '3.12'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3
        if: "contains(matrix.os, 'ubuntu')"
        with:
          channel: '8.x/stable'

      - name: Install python ${{ env.PYTHON_VERSION }}
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Install flatpak tools
        if: "contains(matrix.os, 'ubuntu')"
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rpm
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install ODBC build dependencies (linux)
        if: "contains(matrix.os, 'ubuntu')"
        run: bash ./.github/scripts/linux-install-odbc-deps.sh

      - name: Install ODBC build dependencies (macos)
        if: "startsWith(matrix.os, 'macos')"
        run: bash ./.github/scripts/macos-install-odbc-deps.sh

      - name: Install fpm
        run: sudo gem install fpm -v 1.17.0
        if: "contains(matrix.os, 'ubuntu')"

      # node-gyp checks the PYTHON env var first. Without it, on Windows it asks
      # the py launcher, which picks the newest Python on the runner, not this one.
      - name: Verify Python Version
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          INSTALLED=$("$PYTHON" --version | cut -d " " -f 2)
          echo "node-gyp will use Python $INSTALLED at $PYTHON"
          if [[ $INSTALLED != "$PYTHON_VERSION".* ]]; then
            echo "Error: Python version does not start with $PYTHON_VERSION"
            exit 1
          fi
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # ImageOS identifies the runner image (e.g. ubuntu22, win22, macos15), so
      # caches never cross runner image versions: node_modules holds native
      # modules compiled for one exact image.
      - name: Compute runner image cache id
        shell: bash
        run: echo "RUNNER_IMAGE_ID=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/studio/node_modules
            apps/ui-kit/node_modules
            apps/sqltools/node_modules
          # Python is in the key so a Python bump rebuilds the native modules.
          key: node-modules-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}

      # For msnodesqlv8, if it previously failed in the cached version, clear the cache and try again :)
      - name: Check restored node_modules
        id: nm-health
        if: steps.cache-nm.outputs.cache-hit == 'true'
        continue-on-error: true
        run: node -e "require('msnodesqlv8')"

      - name: Discard broken node_modules
        if: steps.nm-health.outcome == 'failure'
        run: rm -rf node_modules apps/studio/node_modules apps/ui-kit/node_modules apps/sqltools/node_modules

      - name: Clean cache
        if: steps.cache-nm.outputs.cache-hit != 'true' || steps.nm-health.outcome == 'failure'
        run: yarn cache clean

      - name: Check dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true' || steps.nm-health.outcome == 'failure'
        run: "yarn install --frozen-lockfile --network-timeout 100000"
        env:
          npm_config_node_gyp: ${{ github.workspace }}${{ runner.os == 'Windows' && '\node_modules\node-gyp\bin\node-gyp.js' || '/node_modules/node-gyp/bin/node-gyp.js' }}

      - name: Verify msnodesqlv8 native build
        run: node -e "require('msnodesqlv8')"

      # Every database client loads at startup, so one native module that
      # can't load on this arch breaks every connection.
      - name: Verify native modules load in Electron
        run: yarn workspace beekeeper-studio electron ../../bin/check-native-modules.js
        env:
          ELECTRON_RUN_AS_NODE: 1

      - name: Build Electron app
        run: "yarn run electron:build --publish never"
        if: startsWith(matrix.os, 'ubuntu') == false
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: 'lxd'
          USE_SYSTEM_FPM: true

        # Build deb for hardlinks testing
      - name: Build Electron app
        run: yarn run electron:build --publish never --linux deb
        if: startsWith(matrix.os, 'ubuntu')
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: 'lxd'
          USE_SYSTEM_FPM: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}
          path: |
            apps/studio/dist_electron/*.exe
            apps/studio/dist_electron/*.msi
            apps/studio/dist_electron/*.deb
            apps/studio/dist_electron/*.rpm
            apps/studio/dist_electron/*.AppImage
            apps/studio/dist_electron/*.dmg
            apps/studio/dist_electron/*.snap
            apps/studio/dist_electron/*.yml

  test-deb-hardlinks:
    name: Test DEB on separate filesystems
    runs-on: ubuntu-22.04
    needs: masterbuild

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Download DEB artifact
        uses: actions/download-artifact@v7
        with:
          name: ubuntu-22.04
          path: ./deb-package

      - name: List downloaded files
        run: |
          echo "Contents of deb-package directory:"
          ls -lh ./deb-package/

      - name: Find DEB file
        id: find_deb
        run: |
          DEB_FILE=$(find ./deb-package -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb file found in artifact"
            exit 1
          fi
          echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Found DEB file: $DEB_FILE"

      - name: Make test script executable
        run: chmod +x ./bin/test-deb-hardlinks.sh

      - name: Run hardlinks test
        run: |
          echo "Testing: ${{ steps.find_deb.outputs.deb_file }}"
          ./bin/test-deb-hardlinks.sh "${{ steps.find_deb.outputs.deb_file }}"

      - name: Test result
        if: success()
        run: |
          echo "✓ DEB package successfully installs on separate filesystems"
          echo "✓ No hardlinks regression detected"
