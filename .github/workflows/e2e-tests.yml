name: E2E Tests

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - master
    paths-ignore:
      - docs/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js, NPM and PNPM
        uses: jdx/mise-action@v5

      # ImageOS identifies the runner image (e.g. ubuntu22, ubuntu24), so caches
      # never cross runner image versions: node_modules holds native modules
      # compiled for one exact image.
      - name: Compute runner image cache id
        shell: bash
        run: echo "RUNNER_IMAGE_ID=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/studio/node_modules
            apps/ui-kit/node_modules
          key: node-modules-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: pnpm install --frozen-lockfile --fetch-timeout 100000
        env:
          HUSKY: "0"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm -F beekeeper-studio exec playwright install chromium

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [prep]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js, NPM, PNPM, and Python
        uses: jdx/mise-action@v5

      - name: Compute runner image cache id
        shell: bash
        run: echo "RUNNER_IMAGE_ID=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/studio/node_modules
            apps/ui-kit/node_modules
          key: node-modules-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Install Playwright system dependencies
        run: pnpm -F beekeeper-studio exec playwright install-deps chromium

      - name: Build App
        run: pnpm -F beekeeper-studio build

      - name: Start postgres container
        run: docker compose up psql15 -d --wait

      - name: Run Tests
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args "-screen 0 1600x1000x24" bash -c '
            pnpm -F beekeeper-studio test:e2e:ci
          '
        env:
          ELECTRON_ENABLE_LOGGING: 1
          ELECTRON_DISABLE_SANDBOX: 1
          ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: apps/studio/test-results
          retention-days: 7
