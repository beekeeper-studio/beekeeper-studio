name: E2E Smoke Test (Cross-Platform)

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: E2E Smoke - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js, NPM, PNPM, and Python
        uses: jdx/mise-action@v5

      # node-gyp checks the PYTHON env var first. Without it, on Windows it asks
      # the py launcher, which picks the newest Python on the runner, not this one.
      - name: Use mise's Python for node-gyp
        shell: bash
        run: |
          PYTHON="$(mise which python)"
          "$PYTHON" --version
          echo "PYTHON=$PYTHON" >> $GITHUB_ENV

      # ImageOS identifies the runner image (e.g. ubuntu24, win22, macos15), so
      # caches never cross runner image versions: node_modules holds native
      # modules compiled for one exact image.
      - name: Compute runner image cache id
        shell: bash
        run: echo "RUNNER_IMAGE_ID=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/studio/node_modules
            apps/ui-kit/node_modules
          key: node-modules-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: pnpm install --frozen-lockfile --fetch-timeout 100000
        env:
          HUSKY: "0"

      - name: Install xvfb-maybe
        run: npm install -g xvfb-maybe

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm -F beekeeper-studio exec playwright install chromium

      - name: Install Playwright system dependencies (Linux)
        if: runner.os == 'Linux'
        run: pnpm -F beekeeper-studio exec playwright install-deps chromium

      - name: Build UI Kit
        run: pnpm lib:build

      - name: Build App
        run: pnpm -F beekeeper-studio build

      - name: Run Tests (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          xvfb-maybe -a -s "-screen 0 1024x768x24" -- bash -c '
            pnpm -F beekeeper-studio test:e2e:smoke
          '
        env:
          ELECTRON_ENABLE_LOGGING: 1
          ELECTRON_DISABLE_SANDBOX: 1
          ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu"

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm -F beekeeper-studio test:e2e:smoke
        env:
          ELECTRON_ENABLE_LOGGING: 1

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: apps/studio/test-results
          retention-days: 7
