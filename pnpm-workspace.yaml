packages:
  - apps/*

sideEffectsCache: false

overrides:
  cpu-features: "-"
  axios: ^1.15.0
  node-abi: ^4.35.0
  nan: ^2.28.0
  vite: ^8.1.6

allowBuilds:
  core-js: true
  electron-winstaller: true
  esbuild: true
  kerberos: true
  mongodb-client-encryption: true
  msnodesqlv8: true
  oracledb: true
  os-dns-native: true
  protobufjs: true
  sqlanywhere@https://codeload.github.com/beekeeper-studio/node-sqlanywhere/tar.gz/0e1280155455a308c04b07e9f6888372bd513b08: false # needs to be run by electron install-app-deps
  ssh2: false # needs to be run by electron install-app-deps
  vue-demi@0.14.10: true
  macos-export-certificate-and-key@2.0.1: true
  win-export-certificate-and-key@3.0.2: true
  "@vue/web-component-wrapper@https://codeload.github.com/beekeeper-studio/vue-web-component-wrapper/tar.gz/635e4b427b90e199c273b194cf9db6b744d63e95": true
