packages:
  - apps/*

sideEffectsCache: false

allowBuilds:
  core-js: true
  cpu-features: true
  electron-winstaller: true
  esbuild: true
  kerberos: true
  mongodb-client-encryption: true
  msnodesqlv8: true
  oracledb: true
  os-dns-native: true
  protobufjs: true
  sqlanywhere@https://codeload.github.com/beekeeper-studio/node-sqlanywhere/tar.gz/0e1280155455a308c04b07e9f6888372bd513b08: true
  ssh2: true
  vue-demi@0.14.10: true
  macos-export-certificate-and-key@2.0.1: true
  '@vue/web-component-wrapper@https://codeload.github.com/beekeeper-studio/vue-web-component-wrapper/tar.gz/635e4b427b90e199c273b194cf9db6b744d63e95': true
